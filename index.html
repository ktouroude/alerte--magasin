<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerte Magasin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; color: #202938;
      background: #f2f5f9;
    }
    header {
      background: #17365d; color: white; padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; }
    main { max-width: 760px; margin: 22px auto; padding: 0 14px; }
    .card {
      background: white; border-radius: 14px; padding: 20px;
      margin-bottom: 16px; box-shadow: 0 3px 14px #172b4d12;
    }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-weight: bold; margin: 13px 0 6px; }
    input, select {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 16px; background: white;
    }
    button {
      border: 0; border-radius: 8px; padding: 12px 15px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { background: #1769aa; color: white; width: 100%; }
    .danger { background: #b42318; color: white; }
    .secondary { background: #e5edf5; color: #17365d; }
    .hidden { display: none !important; }
    .muted { color: #657286; font-size: 14px; }
    .status { padding: 10px; border-radius: 8px; margin-top: 12px; }
    .error { background: #fee4e2; color: #912018; }
    .success { background: #dcfae6; color: #05603a; }
    .alert {
      border: 1px solid #f0b4ac; background: #fff4f2;
      border-radius: 10px; padding: 14px; margin: 12px 0;
    }
    .alert h3 { margin: 0 0 8px; }
    .alert p { margin: 6px 0; }
    .alert button { margin-right: 8px; }
    .tag { font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }
    .member {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; border-top: 1px solid #e5eaf0; padding: 12px 0;
    }
    .member button { margin: 0; }
    footer { text-align: center; color: #657286; font-size: 12px; padding: 12px; }
  </style>
</head>
<body>
<header>
  <h1>🔔 Alerte Magasin</h1>
  <div>Une équipe informée, un magasin qui roule.</div>
</header>

<main>
  <section class="card" id="loginCard">
    <h2>Connexion à l'équipe</h2>
    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Se connecter</button>
    </form>
    <p class="muted">L'accès est réservé aux membres autorisés par l'administrateur.</p>
    <div id="loginMessage" aria-live="polite"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row">
        <div>
          <h2 style="margin-bottom:5px">Bonjour <span id="currentName">!</span></h2>
          <div class="muted" id="accountInfo"></div>
        </div>
        <button class="secondary" id="logoutBtn">Déconnexion</button>
      </div>
      <button class="secondary" id="soundTestBtn
